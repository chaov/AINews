version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_news_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - CRAWLER_INTERVAL_MINUTES=${CRAWLER_INTERVAL_MINUTES:-60}
    depends_on:
      - mongo
      - redis
    networks:
      - ai_news_network
    restart: unless-stopped

  crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_news_crawler
    command: python -m app.agents.crawler_agent
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    depends_on:
      - mongo
      - redis
    networks:
      - ai_news_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ai_news_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - ai_news_network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ai_news_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai_news_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_news_network
    restart: unless-stopped

networks:
  ai_news_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
